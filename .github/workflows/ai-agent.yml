name: AI agent plugin

on:
  pull_request:
    paths:
      - 'ChromiumBasedEditors/plugins/ai-agent/**'
      - '.github/workflows/ai-agent.yml'
  push:
    branches:
      - main
    paths:
      - 'ChromiumBasedEditors/plugins/ai-agent/**'
      - '.github/workflows/ai-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChromiumBasedEditors/plugins/ai-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ChromiumBasedEditors/plugins/ai-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint, bundle and package the plugin, as for a release
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run
